<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Job Pro - Inscription</title>
    <!-- Chargement de la feuille de style des drapeaux mondiaux -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        .box { max-width: 500px; margin: 40px auto; padding: 30px; background: #1e1e1e; border-radius: 8px; border: 1px solid #333; }
        h1 { color: #FF8C00; font-size: 1.5rem; }
        .profile-btn { width: 100%; background: #2b2b2b; color: white; padding: 15px; margin: 10px 0; border: 1px solid #444; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: left; }
        .profile-btn:hover { border-color: #FF8C00; }
        label { display: block; text-align: left; margin-top: 15px; font-size: 0.85rem; color: #b0b0b0; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #333; background: #2b2b2b; color: white; box-sizing: border-box; }
        .btn-submit { width: 100%; background: #FF8C00; color: white; padding: 14px; border: none; border-radius: 6px; font-weight: bold; margin-top: 20px; cursor: pointer; text-transform: uppercase; }
        
        /* Ajustements CSS spécifiques pour le plugin de drapeaux */
        .iti { width: 100%; text-align: left; margin-top: 5px; }
        .iti__country-list { background-color: #1e1e1e; border: 1px solid #333; color: white; }
        .iti__country:hover { background-color: #2b2b2b; }
        .iti__selected-country { background-color: #2b2b2b; }
    </style>
</head>
<body>

    <div class="box">
        <!-- ÉTAPE 1 : Choix du profil utilisateur -->
        <div id="step-1">
            <h1>Créer votre espace de travail</h1>
            <button type="button" class="profile-btn" onclick="selectProfile('independant')">👷‍♂️ Travailleur Indépendant / Freelance</button>
            <button type="button" class="profile-btn" onclick="selectProfile('client')">👤 Client Particulier</button>
            <button type="button" class="profile-btn" onclick="selectProfile('candidat')">📄 Candidat à l'Emploi</button>
            <button type="button" class="profile-btn" onclick="selectProfile('recruteur')">🏢 Recruteur / Entreprise</button>
        </div>

        <!-- ÉTAPE 2 : Formulaire de saisie d'informations -->
        <div id="step-2" style="display: none;">
            <h1>Vos informations</h1>
            <form onsubmit="event.preventDefault(); finaliserInscriptionDirecte();">
                <label>Nom et Prénom</label>
                <input type="text" id="fullname" required>
                
                <label>Adresse e-mail</label>
                <input type="email" id="email" required>

                <label>Téléphone international (Sélectionnez le drapeau)</label>
                <input type="tel" id="phoneNum" required>

                <label>Ville</label>
                <input type="text" id="city" required>

                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="Minimum 6 caractères" required>

                <label>Confirmez votre mot de passe</label>
                <input type="password" id="confirmPassword" placeholder="Répétez le mot de passe" required>

                <button type="submit" class="btn-submit">Finaliser l'inscription</button>
            </form>
        </div>
    </div>

    <!-- Script requis pour charger la base de données mondiale des drapeaux et indicatifs -->
    <script src="https://jsdelivr.net"></script>
    <script>
        // CONFIGURATION DU PROJET SUPABASE
        const SUPABASE_PROJECT_ID = "hqnhkrzhckgytgxafflcx"; 
        const SUPABASE_URL = `https://${SUPABASE_PROJECT_ID}.supabase.co`; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxbmhremhja2d5dGd4YWZmbGN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTE5NTIsImV4cCI6MjA5NDk2Nzk1Mn0.lbvq-Xwo3fQP5UGBMROA4PafWWmF_B5PUiYx7NN3FxQ";

        let roleChoisi = '';
        let itiInstance;

        // Initialisation de la liste des pays de A à Z avec drapeaux dès que le formulaire s'affiche
        function initialiserDrapeaux() {
            const inputTelephone = document.querySelector("#phoneNum");
            itiInstance = window.intlTelInput(inputTelephone, {
                initialCountry: "ci", // Côte d'Ivoire par défaut, s'adapte selon vos besoins
                preferredCountries: ["ci", "sn", "fr", "ma"], // Pays mis en haut de la liste pour confort
                separateDialCode: true, // Affiche l'indicatif (+225) à côté du drapeau
                utilsScript: "https://jsdelivr.net"
            });
        }

        function selectProfile(role) {
            roleChoisi = role;
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
            initialiserDrapeaux(); // Lance le module mondial au moment de l'affichage du formulaire
        }

        // Inscription de l'utilisateur avec validations avancées
        async function finaliserInscriptionDirecte() {
            const name = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const city = document.getElementById('city').value.trim();
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            // 1. Validation de la correspondance des mots de passe
            if (pass !== confirmPass) {
                alert("❌ Erreur : Les deux mots de passe ne correspondent pas.");
                return;
            }

            // 2. Validation de la longueur minimale imposée par Supabase
            if (pass.length < 6) {
                alert("❌ Erreur : Le mot de passe doit contenir au moins 6 caractères.");
                return;
            }

            // 3. Extraction du numéro complet propre (ex: +2250707070707) et du pays choisi
            const numeroComplet = itiInstance.getNumber();
            const paysChoisi = itiInstance.getSelectedCountryData().name;
            const codeISO = itiInstance.getSelectedCountryData().iso2.toUpperCase();

            try {
                const response = await fetch(SUPABASE_URL + "/auth/v1/signup", {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: pass,
                        options: {
                            data: {
                                full_name: name,
                                role: roleChoisi,
                                country: codeISO, // Stocke le code pays standardisé (ex: "CI", "SN", "CA")
                                country_name: paysChoisi,
                                city: city,
                                phone: numeroComplet // Numéro finalisé et nettoyé au format international
                            }
                        }
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.identities && data.identities.length === 0) {
                        alert("Cet email est déjà lié à un compte existant.");
                        return;
                    }
                    alert("✓ Inscription réussie !");
                    window.location.href = "connexion.html";
                } else {
                    alert("Erreur de l'API Supabase : " + (data.msg || data.error_description || "Une erreur est survenue."));
                }
            } catch (err) {
                alert("Erreur réseau : Impossible de joindre Supabase.");
                console.error(err);
            }
        }
    </script>
</body>
</html>
