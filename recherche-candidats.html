<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Job Pro | Radar Cartographique International</title>
    
    <!-- Chargement des outils de carte gratuite Leaflet (CSS + JS) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    
    <style>
        html, body { max-width: 100%; overflow-x: hidden; margin: 0; padding: 0; background: #121212; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        *, *:before, *:after { box-sizing: border-box; }
        
        .sidebar { width: 260px; background: #0A1F13; border-right: 1px solid #1a2e22; display: flex; flex-direction: column; padding: 20px; position: fixed; height: 100vh; z-index: 1000; }
        .logo-dash { color: #FF8C00; font-size: 1.5rem; font-weight: 800; text-transform: uppercase; text-decoration: none; }
        
        .main-content { flex: 1; margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        h2 { color: #f0f0f0; font-size: 1.6rem; font-weight: 600; margin-top: 0; margin-bottom: 25px; }
        
        .gps-indicator-bar { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #FF8C00; font-size: 0.9rem; font-weight: bold; }
        
        #map-container { width: 100%; height: 400px; border-radius: 12px; border: 1px solid #333; margin-bottom: 30px; z-index: 10; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .candidates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .talent-card { background: #1e1e1e; border-radius: 10px; padding: 20px; border: 1px solid #333; border-bottom: 4px solid #2ECC71; display: flex; flex-direction: column; justify-content: space-between; }
        .avatar-circle { width: 45px; height: 45px; background: #FF8C00; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .distance-badge { font-size: 0.8rem; color: #2ECC71; font-weight: bold; margin-top: 5px; display: block; }
        .btn-profile { width: 100%; background: transparent; border: 1px solid #FF8C00; color: #FF8C00; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; text-transform: uppercase; font-size: 0.85rem; }
        
        .leaflet-popup-content-wrapper { background: #1e1e1e; color: #fff; border: 1px solid #444; }
        .leaflet-popup-tip { background: #1e1e1e; }
        .no-results-msg { text-align: center; color: #ff4d4d; font-weight: bold; padding: 30px; display: none; width: 100%; }

        @media (max-width: 768px) { .sidebar { position: relative; width: 100%; height: auto; } .main-content { margin-left: 0; width: 100%; padding: 20px; } }
    </style>
</head>
<body>

    <nav class="sidebar">
        <a href="index.html" class="logo-dash" style="margin-bottom: 30px; display: block;">My Job Pro</a>
    </nav>

    <main class="main-content">
        <h2>Radar de Proximité International</h2>
        
        <div class="gps-indicator-bar" id="yango-gps-status">🌍 Analyse de votre position géographique mondiale...</div>

        <!-- CARTE CLOUD MONDIALE -->
        <div id="map-container"></div>

        <div class="candidates-grid" id="candidates-container"></div>
        <div id="no-results" class="no-results-msg">Aucun professionnel disponible dans un rayon de 50 km autour de votre secteur.</div>
    </main>

    <script>
        // ⚠️ INSÉREZ VOS CLÉS SUPABASE ICI ⚠️
        const CONFIG_SUPABASE_URL = "https://hqnhkzhckgytgxafflcx.supabase.co"; 
        const CONFIG_SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxbmhremhja2d5dGd4YWZmbGN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTE5NTIsImV4cCI6MjA5NDk2Nzk1Mn0.lbvq-Xwo3fQP5UGBMROA4PafWWmF_B5PUiYx7NN3FxQ";              

        let carteInteractive;
        let listeArtisansCloud = [];
        let monLatActuel = 0; 
        let monLonActuel = 0;
        let nomSecteurDetecte = "votre zone";

        window.onload = function() {
            detecterPositionMondialeAutomatique();
        };

        // STYLE YANGO : DÉTECTION PAR SATELLITE OU IP SANS BLOCAGE
        function detecterPositionMondialeAutomatique() {
            const statusBox = document.getElementById('yango-gps-status');
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        // Succès GPS : Précision maximale à la rue près
                        monLatActuel = p.coords.latitude;
                        monLonActuel = p.coords.longitude;
                        statusBox.textContent = "🟢 Position géo-synchronisée par satellite. Radar actif dans votre quartier.";
                        statusBox.style.color = "#2ECC71";
                        statusBox.style.borderLeftColor = "#2ECC71";
                        
                        initialiserCartePlanMondiale();
                        fetchArtisansCloudDirect();
                    },
                    () => {
                        // Échec GPS : Déclenchement du secours par adresse IP (Peu importe le pays/ville)
                        recourirALocalisationParIP(statusBox);
                    }
                );
            } else {
                recourirALocalisationParIP(statusBox);
            }
        }

        // BACKUP TECH : Détection de la ville et commune peu importe le pays [ipapi.co]
        async function recourirALocalisationParIP(statusBox) {
            try {
                const reponseIP = await fetch("https://ipapi.co");
                const donneesZone = await reponseIP.json();
                
                monLatActuel = donneesZone.latitude;
                monLonActuel = donneesZone.longitude;
                nomSecteurDetecte = `\${donneesZone.city} (\${donneesZone.country_name})`;
                
                statusBox.textContent = `🔵 GPS inactif. Secteur détecté par réseau : \${nomSecteurDetecte}.`;
                statusBox.style.color = "#FF8C00";
                statusBox.style.borderLeftColor = "#FF8C00";
            } catch (err) {
                // Secours ultime (Zéro réseau détecté) : Ancrage neutre par défaut
                monLatActuel = 48.8566; // Paris par défaut si tout coupe
                monLonActuel = 2.3522;
                statusBox.textContent = "🟡 Signal réseau limité. Radar en mode international ouvert.";
            }
            initialiserCartePlanMondiale();
            fetchArtisansCloudDirect();
        }

        // INITIALISATION DU PLAN DE LA VILLE CONCERNÉE
        function initialiserCartePlanMondiale() {
            carteInteractive = L.map('map-container').setView([monLatActuel, monLonActuel], 12);
            
            L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(carteInteractive);

            L.marker([monLatActuel, monLonActuel]).addTo(carteInteractive)
                .bindPopup("<strong style='color:#FF8C00;'>Votre position</strong><br>Centre de votre secteur de recherche.")
                .openPopup();
        }

        async function fetchArtisansCloudDirect() {
            try {
                const urlFetch = `\${CONFIG_SUPABASE_URL}/rest/v1/users?role=eq.independant&select=*`;
                const reponse = await fetch(urlFetch, { 
                    method: 'GET', 
                    headers: { 'apikey': CONFIG_SUPABASE_KEY, 'Authorization': `Bearer \${CONFIG_SUPABASE_KEY}` } 
                });
                listeArtisansCloud = await reponse.json();
                afficherArtisansGridMondiale();
            } catch (err) {
                console.error("Lien cloud interrompu.");
            }
        }

        function calculerDistanceKM(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function afficherArtisansGridMondiale() {
            const container = document.getElementById('candidates-container');
            container.innerHTML = '';
            let compteurArtisansProches = 0;
            
            listeArtisansCloud.forEach(artisan => {
                const distance = calculerDistanceKM(monLatActuel, monLonActuel, artisan.latitude, artisan.longitude);
                
                // LE FILTRE DE SECTEUR : L'artisan doit être à moins de 50 km du client (Peu importe sa ville ou son pays)
                if (distance <= 50) {
                    compteurArtisansProches++;

                    // Insertion de l'épingle sur la carte de la ville correspondante
                    L.marker([artisan.latitude, artisan.longitude]).addTo(carteInteractive)
                        .bindPopup(`<strong style='color:#2ECC71;'>\${artisan.name}</strong><br>\${artisan.activity}<br>📍 À \${distance.toFixed(1)} km`);

                    // Insertion de la fiche descriptive
                    const card = document.createElement('div');
                    card.className = "talent-card";
                    card.innerHTML = `
                        <div style="display:flex; align-items:center; gap:15px;">
                            <div class="avatar-circle">\${artisan.name.substring(0,2).toUpperCase()}</div>
                            <div>
                                <h3 style="margin:0; font-size:1.1rem;">\${artisan.name}</h3>
