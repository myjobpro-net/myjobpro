        .nav-right a { color: #FF8C00; text-decoration: none; font-weight: bold; font-size: 0.9rem; }

        label { display: block; margin-top: 15px; margin-bottom: 8px; font-size: 0.85rem; color: #b0b0b0; }

        .password-container { position: relative; width: 100%; }
        .toggle-text { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #2ECC71; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; user-select: none; }
        
        .btn-submit { background: #FF8C00; color: white; padding: 14px; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; width: 100%; text-transform: uppercase; font-size: 0.9rem; margin-top: 25px; transition: 0.3s; }

        .btn-submit:disabled { background: #444; color: #888; cursor: not-allowed; }

        // EXÉCUTION DE LA DÉTECTION INVISIBLE AUTOMATIQUE
        async function initialiserPageConnexionAutomatique() {
            const structureNavigateur = navigator.language || navigator.userLanguage;
            const prefixeSys = structureNavigateur.substring(0, 2).toLowerCase();
            
            if (["fr", "en", "es", "de"].includes(prefixeSys)) { langueAutomatique = prefixeSys; }

            try {
                const fluxGeo = await fetch("https://ipapi.co");
                const zone = await fluxGeo.json();
                
                if(["DE", "AT", "CH"].includes(zone.country_code)) langueAutomatique = "de";
                else if(["ES", "MX", "AR", "CO", "CL"].includes(zone.country_code)) langueAutomatique = "es";
                else if(["FR", "CI", "SN", "BF", "CM", "BE"].includes(zone.country_code)) langueAutomatique = "fr";

                document.getElementById('geo-detect-badge').textContent = `\${dictionnaireConnexion[langueAutomatique].flag} \${zone.city}`;
            } catch (err) {
                document.getElementById('geo-detect-badge').textContent = `\${dictionnaireConnexion[langueAutomatique].flag} Online`;
            }

            appliquerTraductionConnexion(langueAutomatique);
        }

        function appliquerTraductionConnexion(langue) {
            const txt = dictionnaireConnexion[langue];
            if (!txt) return;

            document.getElementById('txt-nav-register').textContent = txt.registerNav;
            document.getElementById('txt-login-title').textContent = txt.loginTitle;
